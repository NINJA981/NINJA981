<svg width="100%" height="auto" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f85149" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3fb950" />
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect width="960" height="360" rx="12" fill="url(#cyberBg)" />
  <rect x="0.5" y="0.5" width="959" height="359" rx="11.5" fill="none" stroke="#30363d" />

  <!-- Diagram Title -->
  <g transform="translate(32, 24)">
    <text x="0" y="10" fill="#f85149" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.14em">CYBERARENA // DETERMINISTIC ATTACK-DEFENSE SIMULATION ENGINE</text>
    <text x="0" y="28" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Decoupled stateful simulation loop with real SAST rule enforcement vs post-mortem AI triage.</text>
  </g>

  <!-- Main Architecture Grid -->
  
  <!-- Left Side: 1. Digital Twin Topology & SAST Rule Evaluation -->
  <g transform="translate(32, 65)">
    <rect x="0" y="0" width="430" height="265" rx="8" fill="#111622" stroke="#21262d" stroke-width="1" />
    <text x="16" y="24" fill="#79c0ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing="0.08em">1. TOPOLOGY &amp; SAST EVALUATION</text>

    <!-- Node topology chain mini representation -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="398" height="74" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <text x="12" y="18" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">Digital Twin Topology Mesh</text>
      
      <!-- Network Nodes flow -->
      <g transform="translate(10, 30)">
        <!-- Node 1: Firewall -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="64" height="28" rx="5" fill="#1f2532" stroke="#38bdf8" stroke-width="0.8" />
          <text x="32" y="18" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Firewall</text>
        </g>
        
        <!-- Arrow 1 -> 2 -->
        <path d="M 66 14 L 74 14" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)" />
        
        <!-- Node 2: Ingress / LB -->
        <g transform="translate(78, 0)">
          <rect x="0" y="0" width="66" height="28" rx="5" fill="#1f2532" stroke="#30363d" stroke-width="0.8" />
          <text x="33" y="18" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ingress LB</text>
        </g>

        <!-- Arrow 2 -> 3 -->
        <path d="M 146 14 L 154 14" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)" />

        <!-- Node 3: Web Node -->
        <g transform="translate(158, 0)">
          <rect x="0" y="0" width="64" height="28" rx="5" fill="#1f2532" stroke="#30363d" stroke-width="0.8" />
          <text x="32" y="18" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Web Node</text>
        </g>

        <!-- Arrow 3 -> 4 -->
        <path d="M 224 14 L 232 14" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)" />

        <!-- Node 4: API / Auth -->
        <g transform="translate(236, 0)">
          <rect x="0" y="0" width="66" height="28" rx="5" fill="#1f2532" stroke="#30363d" stroke-width="0.8" />
          <text x="33" y="18" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">API / Auth</text>
        </g>

        <!-- Arrow 4 -> 5 -->
        <path d="M 304 14 L 312 14" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)" />

        <!-- Node 5: Database -->
        <g transform="translate(316, 0)">
          <rect x="0" y="0" width="62" height="28" rx="5" fill="#1f2532" stroke="#30363d" stroke-width="0.8" />
          <text x="31" y="18" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Database</text>
        </g>
      </g>
    </g>

    <!-- SAST Rule Engine box -->
    <g transform="translate(16, 120)">
      <rect x="0" y="0" width="398" height="62" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <text x="12" y="18" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">SAST Security Rule Scanner</text>
      <text x="12" y="34" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">evaluates arena/{template} configs (CORS, 0.0.0.0, SSH)</text>
      <text x="12" y="50" fill="#3fb950" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">Determines baseline vulnerability index &amp; active defenses</text>
    </g>

    <!-- TanStack Start runtime note -->
    <g transform="translate(16, 192)">
      <rect x="0" y="0" width="398" height="58" rx="6" fill="#0d1117" stroke="#38bdf8" stroke-width="0.8" />
      <text x="12" y="18" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">RUNTIME ENVIRONMENT</text>
      <text x="12" y="34" fill="#c9d1d9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">React 19 + TanStack Start server functions + Vite</text>
      <text x="12" y="48" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5">State persisted in client-side reactive store (simStore)</text>
    </g>
  </g>

  <!-- Center Arrow connecting Engine -->
  <path d="M 465 190 L 492 190" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)" />

  <!-- Right Side: 2. Deterministic Simulation Loop vs AI Post-Mortem -->
  <g transform="translate(498, 65)">
    <rect x="0" y="0" width="430" height="265" rx="8" fill="#111622" stroke="#21262d" stroke-width="1" />
    <text x="16" y="24" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing="0.08em">2. ENGINE VS. AI SEPARATION</text>

    <!-- Deterministic Engine Box -->
    <g transform="translate(16, 40)">
      <rect x="0" y="0" width="398" height="100" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.2" />
      <!-- Header with badge -->
      <text x="12" y="20" fill="#3fb950" font-family="ui-monospace, monospace" font-size="11" font-weight="700">DETERMINISTIC SIMULATION CORE</text>
      <rect x="290" y="8" width="96" height="18" rx="3" fill="#172b1d" />
      <text x="338" y="20" fill="#3fb950" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">100% CODE DRIVEN</text>

      <text x="12" y="44" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        • Scripted attack timeline (scenario.ts) &amp; Red Team actions
      </text>
      <text x="12" y="62" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        • Blue Team defensive triggers (rate limiting, isolation, WAF)
      </text>
      <text x="12" y="82" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">
        Outcome calculated via math/state machine, NOT LLM dice-rolls
      </text>
    </g>

    <!-- Post-Mortem AI Report Box -->
    <g transform="translate(16, 150)">
      <rect x="0" y="0" width="398" height="100" rx="6" fill="#161b22" stroke="#818cf8" stroke-width="1.2" />
      <text x="12" y="20" fill="#818cf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">AI INCIDENT REFEREE &amp; POST-MORTEM</text>
      <rect x="300" y="8" width="86" height="18" rx="3" fill="#1e2238" />
      <text x="343" y="20" fill="#818cf8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">AFTER-ACTION</text>

      <text x="12" y="44" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        • Summarizes deterministic event logs, telemetry &amp; timeline
      </text>
      <text x="12" y="62" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
        • Generates Markdown incident report &amp; root-cause insights
      </text>
      <text x="12" y="82" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">
        Powered by Gemini 2.5 Flash for human-readable post-mortems
      </text>
    </g>
  </g>
</svg>
