<title id="t">Connect 4: game in progress</title>
<desc id="d">Connect 4 board with 7 columns and 6 rows. Visitors play orange and the bot plays the other colour. 4 discs have been played. The last disc went into column 4. From bottom to top, column 1: empty; column 2: empty; column 3: visitor; column 4: bot, visitor, bot; column 5: empty; column 6: empty; column 7: empty. The game is in progress and it is the visitors' turn.</desc>
