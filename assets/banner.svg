<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Sai Charan, Software and AI Engineer, Chennai">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="0.55" stop-color="#1c2541"/>
      <stop offset="1" stop-color="#3a506b"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.88" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#5bc0be" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5bc0be" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.08" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fb3c8" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#5bc0be" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5bc0be"/>
      <stop offset="1" stop-color="#5bc0be" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <rect width="1200" height="240" fill="url(#glowR)"/>
  <rect width="1200" height="240" fill="url(#glowL)"/>

  <!-- orbit rings (right) -->
  <g fill="none" stroke="#5bc0be" stroke-opacity="0.35">
    <circle cx="1060" cy="120" r="70">
      <animate attributeName="r" values="66;78;66" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0.12;0.45" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="120" r="110" stroke-opacity="0.18"/>
    <circle cx="1060" cy="120" r="150" stroke-opacity="0.09"/>
  </g>
  <circle cx="1060" cy="120" r="7" fill="#5bc0be">
    <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1130" cy="120" r="4" fill="#ff7a18">
    <animateTransform attributeName="transform" type="rotate" from="0 1060 120" to="360 1060 120" dur="14s" repeatCount="indefinite"/>
  </circle>

  <text x="80" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="1">Sai Charan</text>
  <rect x="82" y="132" width="360" height="3" rx="1.5" fill="url(#line)"/>
  <text x="82" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#9fb3c8" letter-spacing="5">SOFTWARE &amp; AI ENGINEER  ·  CHENNAI</text>
  <text x="82" y="204" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#5bc0be" fill-opacity="0.9">ClassIQ  ·  Solace  ·  LeetX Squads  ·  CryptoTrace  ·  JARVIS</text>
</svg>
