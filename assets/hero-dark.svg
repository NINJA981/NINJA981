<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="236" viewBox="0 0 1000 236" role="img" aria-label="Sai Charan, software and AI engineer in Chennai. Open to on-site internships.">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0.5" y="0.5" width="999" height="235" rx="14"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="235" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g clip-path="url(#card)">
    <rect width="1000" height="236" fill="url(#grid)" opacity="0.55"/>
    <rect x="0" y="232" width="1000" height="4" fill="url(#accent)"/>
  </g>

  <!-- left: identity -->
  <text x="48" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Sai Charan</text>
  <text x="48" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9">Software &amp; AI engineer</text>
  <text x="48" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">I build AI products that real people use.</text>

  <rect x="48" y="170" width="318" height="32" rx="16" fill="#0f2d1c" stroke="#238636"/>
  <circle cx="68" cy="186" r="5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="191" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#3fb950" font-weight="600">Open to on-site internships  ·  Chennai</text>

  <!-- right: terminal -->
  <rect x="528" y="30" width="440" height="176" rx="10" fill="#010409" stroke="#30363d"/>
  <circle cx="548" cy="48" r="5" fill="#ff5f56"/>
  <circle cx="566" cy="48" r="5" fill="#ffbd2e"/>
  <circle cx="584" cy="48" r="5" fill="#27c93f"/>
  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="13.5">
    <text x="548" y="84"><tspan fill="#3fb950">$</tspan><tspan fill="#8b949e"> whoami</tspan></text>
    <text x="548" y="106" fill="#c9d1d9">sai-charan · cse '29 · ml intern @ benx</text>
    <text x="548" y="134"><tspan fill="#3fb950">$</tspan><tspan fill="#8b949e"> ls ~/shipped</tspan></text>
    <text x="548" y="156" fill="#58a6ff">classiq  solace  leetx-squads</text>
    <text x="548" y="176" fill="#58a6ff">cryptotrace  jarvis  visionnav</text>
    <text x="548" y="196"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> </tspan></text>
    <rect x="566" y="184" width="8" height="15" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
