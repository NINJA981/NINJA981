      <text x="14" y="98" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="500">Agentic Orchestration</text>

      <text x="0" y="132" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">Focus: Beyond Simple Wrappers</text>
