      <text x="14" y="76" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="500">Attack Path Progression</text>

      <circle cx="4" cy="94" r="2.5" fill="#f85149" />
      <text x="14" y="98" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="500">Defense &amp; Node Resilience</text>

